<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー編集 - ユーザー管理システム</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 3px;
        }
        .form-error {
            border-color: #dc3545 !important;
        }
        .required {
            color: red;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ユーザー管理システム</h1>
    </div>
    
    <div class="content-container">
        <div class="nav">
            <a th:href="@{/users/list}">ユーザー一覧</a>
            <a th:href="@{/users/register}">新規登録</a>
        </div>
        
        <h2>ユーザー編集</h2>
        
        <form th:action="@{/users/edit}" th:object="${userForm}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <!-- 全体エラーメッセージ（フォーム内に移動） -->
            <div th:if="${#fields.hasGlobalErrors()}" class="error" style="margin-bottom: 20px;">
                <ul style="margin: 0; padding-left: 20px;">
                    <li th:each="error : ${#fields.globalErrors()}" th:text="${error}"></li>
                </ul>
            </div>
            
            <div class="form-group">
                <label for="name">名前 <span class="required">*</span></label>
                <input type="text" id="name" th:field="*{name}" 
                       th:class="${#fields.hasErrors('name')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('name')}" class="error-message">
                    <span th:errors="*{name}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="kana">カナ <span class="required">*</span></label>
                <input type="text" id="kana" th:field="*{kana}" 
                       th:class="${#fields.hasErrors('kana')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('kana')}" class="error-message">
                    <span th:errors="*{kana}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">メールアドレス <span class="required">*</span></label>
                <input type="email" id="email" th:field="*{email}" 
                       th:class="${#fields.hasErrors('email')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('email')}" class="error-message">
                    <span th:errors="*{email}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="department">部署 <span class="required">*</span></label>
                <input type="text" id="department" th:field="*{department}" 
                       th:class="${#fields.hasErrors('department')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('department')}" class="error-message">
                    <span th:errors="*{department}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="birthDate">生年月日 <span class="required">*</span></label>
                <input type="date" id="birthDate" th:field="*{birthDate}" 
                       th:class="${#fields.hasErrors('birthDate')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('birthDate')}" class="error-message">
                    <span th:errors="*{birthDate}"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="hireDate">入社日 <span class="required">*</span></label>
                <input type="date" id="hireDate" th:field="*{hireDate}" 
                       th:class="${#fields.hasErrors('hireDate')} ? 'form-error' : ''">
                <div th:if="${#fields.hasErrors('hireDate')}" class="error-message">
                    <span th:errors="*{hireDate}"></span>
                </div>
            </div>
            
            <div>
                <button type="submit" class="btn btn-primary">更新</button>
                <a th:href="@{/users/detail/{id}(id=${userForm.id})}" class="btn btn-secondary">詳細に戻る</a>
                <a th:href="@{/users/list}" class="btn btn-secondary">一覧に戻る</a>
            </div>
        </form>
    </div>
</body>
</html>
